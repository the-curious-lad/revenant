services:
  - type: web
    name: revenant-ghost-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: revenant_db
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
